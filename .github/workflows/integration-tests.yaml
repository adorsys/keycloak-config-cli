---
# Runs the *IT integration tests (Testcontainers) against real Keycloak servers.
# The CI workflow only runs unit tests: maven-failsafe-plugin is not configured, so surefire's
# default includes skip every *IT class. This workflow selects them explicitly.
#
# This workflow runs untrusted pull request code, so it only has a read-only token. It stores the
# test summary and the pull request number as an artifact; the separate "Integration tests report"
# workflow (workflow_run) posts that summary on the pull request with a write token, without
# checking out or running any pull request code.
name: Integration tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: '-ntp --batch-mode --errors --fail-at-end --show-version -Dstyle.color=always'
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        env:
          - KEYCLOAK_VERSION: 26.8.1
            KEYCLOAK_CLIENT_VERSION: 26.0.13
    name: integration-tests (${{ matrix.env.KEYCLOAK_VERSION }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-it-${{ matrix.env.KEYCLOAK_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-${{ matrix.env.KEYCLOAK_VERSION }}

      - name: Pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:${{ matrix.env.KEYCLOAK_VERSION }}

      - name: Run integration tests
        run: >-
          ./mvnw ${MAVEN_CLI_OPTS}
          -Dkeycloak.version=${{ matrix.env.KEYCLOAK_VERSION }}
          -Dkeycloak.client.version=${{ matrix.env.KEYCLOAK_CLIENT_VERSION }}
          -Dtest='**/*IT' -Dsurefire.failIfNoSpecifiedTests=false
          -Djacoco.skip=true -Dcheckstyle.skip -Dpmd.skip -Dspotbugs.skip
          clean verify

      - name: Summarize test results
        if: always()
        env:
          KEYCLOAK_VERSION: ${{ matrix.env.KEYCLOAK_VERSION }}
        run: |
          mkdir -p it-report
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY" > "it-report/summary-${KEYCLOAK_VERSION}.md"
          import glob, os, xml.etree.ElementTree as ET
          total = failed = errors = skipped = 0
          broken = []
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              suite = ET.parse(f).getroot()
              total += int(suite.get('tests', 0)); failed += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0)); skipped += int(suite.get('skipped', 0))
              for case in suite.iter('testcase'):
                  bad = case.find('failure')
                  if bad is None:
                      bad = case.find('error')
                  if bad is not None:
                      msg = (bad.get('message') or '').replace('\n', ' ').replace('|', '\\|')[:200]
                      broken.append(f"| {case.get('classname').split('.')[-1]} | {case.get('name')} | {msg} |")
          print(f"### Keycloak {os.environ['KEYCLOAK_VERSION']}: {total} tests, {failed} failures, {errors} errors, {skipped} skipped\n")
          if broken:
              print("| Class | Test | Message |\n|---|---|---|")
              print("\n".join(sorted(broken)))
          EOF

      - name: Record pull request number for the report workflow
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > it-report/pr-number

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: it-summary-${{ matrix.env.KEYCLOAK_VERSION }}
          path: it-report/
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: it-reports-${{ matrix.env.KEYCLOAK_VERSION }}
          path: target/surefire-reports/
          retention-days: 14
